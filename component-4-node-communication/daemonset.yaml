apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-daemon
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: node-daemon
  template:
    metadata:
      labels:
        app: node-daemon
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists

      volumes:
        - name: peers-cm
          configMap:
            name: node-daemon-peers

      containers:
        - name: node-daemon
          image: p2p-node:v3
          imagePullPolicy: IfNotPresent

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: PEERS
              value: "/etc/node-daemon/peers.txt"    # <- NEW: use env to pass path

          volumeMounts:
            - name: peers-cm
              mountPath: /etc/node-daemon

          # DO NOT use args here (it will override the image CMD)
          ports:
            - containerPort: 8080
