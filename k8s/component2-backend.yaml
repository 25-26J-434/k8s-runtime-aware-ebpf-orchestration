apiVersion: apps/v1
kind: Deployment
metadata:
  name: component2-backend
  namespace: test-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: component2-backend
  template:
    metadata:
      labels:
        app: component2-backend
    spec:
      serviceAccountName: component2-backend
      containers:
        - name: backend
          image: component2-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: SERVICE_A_WHOAMI_URL
              value: "http://service-a.test-services.svc.cluster.local:5000/whoami"
            - name: MONGODB_URI
              value: "mongodb://mongo.mongo.svc.cluster.local:27017/component2?replicaSet=rs0"
            - name: SERVICE_NAME
              value: "component2-backend"

---
apiVersion: v1
kind: Service
metadata:
  name: component2-backend
  namespace: test-services
spec:
  selector:
    app: component2-backend
  ports:
    - name: http
      port: 4000
      targetPort: 4000

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: component2-backend
  namespace: test-services

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: component2-backend-lrp
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]

  - apiGroups: ["cilium.io"]
    resources: ["ciliumlocalredirectpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: component2-backend-lrp-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: component2-backend-lrp
subjects:
  - kind: ServiceAccount
    name: component2-backend
    namespace: test-services

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: test-services
spec:
  selector:
    app: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: test-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:6.0
          imagePullPolicy: IfNotPresent
          args:
            - --bind_ip_all
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          emptyDir: {}
