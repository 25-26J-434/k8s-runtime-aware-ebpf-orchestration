apiVersion: v1
kind: ServiceAccount
metadata:
  name: kerneleye-scheduler
  namespace: ebpf-telemetry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kerneleye-scheduler
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/binding"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kerneleye-scheduler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kerneleye-scheduler
subjects:
  - kind: ServiceAccount
    name: kerneleye-scheduler
    namespace: ebpf-telemetry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kerneleye-scheduler
  namespace: ebpf-telemetry
  labels:
    app: kerneleye-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kerneleye-scheduler
  template:
    metadata:
      labels:
        app: kerneleye-scheduler
    spec:
      serviceAccountName: kerneleye-scheduler
      containers:
        - name: scheduler
          image: ebpf-daemon:latest
          imagePullPolicy: IfNotPresent
          command: ["./kerneleye-scheduler"]
          env:
            - name: SCHEDULER_NAME
              value: "kerneleye-scheduler"
            - name: METRICS_WS_URL
              value: "ws://ebpf-daemon.ebpf-telemetry.svc.cluster.local:8080/api/metrics/ws"
            - name: METRICS_STALE_AFTER
              value: "10s"
            - name: UNKNOWN_SCORE
              value: "50"
            - name: FILTER_DISK_PRESSURE
              value: "true"
            - name: FILTER_MEMORY_PRESSURE
              value: "true"
            - name: FILTER_PID_PRESSURE
              value: "true"
