kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ebpf-cluster

nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      - containerPort: 30080
        hostPort: 8081
        protocol: TCP
    extraMounts:
      - hostPath: /lib/modules
        containerPath: /lib/modules
        readOnly: true
      - hostPath: /sys/fs/bpf
        containerPath: /sys/fs/bpf
        readOnly: false

  - role: worker
    extraMounts:
      - hostPath: /lib/modules
        containerPath: /lib/modules
        readOnly: true
      - hostPath: /sys/fs/bpf
        containerPath: /sys/fs/bpf
        readOnly: false

  - role: worker
    extraMounts:
      - hostPath: /lib/modules
        containerPath: /lib/modules
        readOnly: true
      - hostPath: /sys/fs/bpf
        containerPath: /sys/fs/bpf
        readOnly: false

# Disable default CNI (kindnet) so Cilium is the only CNI. Avoids conflicts
# with CoreDNS and enables Cilium for all 4 components (1=daemon, 2=routing, 3=scaling, 4=node-comm).
networking:
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
