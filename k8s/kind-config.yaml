# Based on Cilium official kind-config:
#   curl -LO https://raw.githubusercontent.com/cilium/cilium/1.18.6/Documentation/installation/kind-config.yaml
#   kind create cluster --config=kind-config.yaml
# Plus project-specific: eBPF mounts for Component 1, port mappings, name ebpf-cluster
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ebpf-cluster

nodes:
  - role: control-plane
    image: kindest/node:v1.33.2
    extraPortMappings:
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      - containerPort: 30080
        hostPort: 8081
        protocol: TCP
#    extraMounts:
#      - hostPath: /lib/modules
#        containerPath: /lib/modules
#        readOnly: true
#      - hostPath: /sys/fs/bpf
#        containerPath: /sys/fs/bpf
#        readOnly: false

  - role: worker
    image: kindest/node:v1.33.2
#    extraMounts:
#      - hostPath: /lib/modules
#        containerPath: /lib/modules
#        readOnly: true
#      - hostPath: /sys/fs/bpf
#        containerPath: /sys/fs/bpf
#        readOnly: false

  - role: worker
    image: kindest/node:v1.33.2
#    extraMounts:
#      - hostPath: /lib/modules
#        containerPath: /lib/modules
#        readOnly: true
#      - hostPath: /sys/fs/bpf
#        containerPath: /sys/fs/bpf
#        readOnly: false

# Disable default CNI (kindnet) so Cilium is the only CNI. Avoids conflicts
# with CoreDNS and enables Cilium for all 4 components (1=daemon, 2=routing, 3=scaling, 4=node-comm).
networking:
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
