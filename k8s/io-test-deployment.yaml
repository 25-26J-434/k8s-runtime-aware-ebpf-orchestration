apiVersion: apps/v1
kind: Deployment
metadata:
  name: io-test-app
  namespace: test-services
  labels:
    app: io-test-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: io-test-app
  template:
    metadata:
      labels:
        app: io-test-app
    spec:
      containers:
      - name: io-app
        image: io-test-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: io-test-service
  namespace: test-services
spec:
  selector:
    app: io-test-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: ClusterIP

